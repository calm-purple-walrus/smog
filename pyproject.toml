[project]
name = "smog"
version = "0.1.0"
description = "Code quality framework for Rust repositories: metrics, scores and merge conditions."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "tree-sitter>=0.25",
    "tree-sitter-rust>=0.24",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
